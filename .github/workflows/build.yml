name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick

      - name: Install npm packages
        run: |
          npm install
          npm install --no-save @diffusionstudio/piper-wasm@1.0.0 || echo "piper-wasm npm package unavailable, will download instead"
          npm install @capacitor-community/text-to-speech@^6 || echo "System TTS plugin skipped"
          npm install @capawesome-team/capacitor-android-foreground-service@^7 || echo "Foreground service plugin skipped"

      - name: Prepare web files, voices and libraries
        run: bash prepare.sh

      - name: Create Android project
        run: |
          npx cap add android
          bash patch-android.sh
          npx cap sync android
          echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "OfflineReader-v${APP_VERSION}.apk" && ls -lh OfflineReader-v*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineReader-APK
          path: OfflineReader-v*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Offline Reader v${{ env.APP_VERSION }}
          files: OfflineReader-v*.apk
          make_latest: true
